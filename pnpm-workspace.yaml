allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@aws-cdk/cloud-assembly-schema@53.25.0'
  - '@types/node@25.9.1'
  - aws-cdk-lib@2.256.0
  - aws-cdk@2.1123.0
  - ts-jest@29.4.10
  - '@orcabus/platform-cdk-constructs@1.9.2 || 1.9.5 || 1.9.6 || 1.9.7 || 1.9.9 || 1.9.10'
overrides:
  brace-expansion@>=2.0.0 <2.1.5: ^2.1.5
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  # sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c) has no patched release. It is pulled
  # in only via js-yaml@3 -> argparse@1 inside jest's coverage tooling. Forcing
  # argparse to 2.x drops the sprintf-js dependency entirely.
  argparse@^1: ^2.0.1
